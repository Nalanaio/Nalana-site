<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>@font-face{font-family:'Amulya';src:url('../fonts/Amulya-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; padding: 0; display: flex; height: 180px; overflow: hidden; }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; }
  .p1 { background: #fafafa; }
  .p2 { background: #f1f1f1; }
  .p3 { background: #0a0a0a; }
  .p4 { background: #fff8f2; }
  img.logo { height: 56px; width: auto; object-fit: contain; }
  .bg-label { font-size: 10px; font-weight: 600; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.06em; }
  .p3 .bg-label { color: #555; }

  /* Inline nalana wordmark SVG from site source */
  .nalana-wordmark { height: 22px; width: auto; }

  /* N mark from assets */
  .n-mark { height: 48px; width: auto; filter: drop-shadow(2px 3px 3px rgba(167,138,222,0.6)); }
</style>
</head>

  <div class="panel p1">
    <img class="n-mark" src="../assets/Nalana-White.png" alt="nalana N mark" />
    <div class="bg-label">White BG</div>
  </div>
  <div class="panel p2">
    <img class="n-mark" src="../assets/Nalana-Off-White.png" alt="nalana N mark off-white" />
    <div class="bg-label">Off-White BG</div>
  </div>
  <div class="panel p3">
    <img class="n-mark" src="../assets/Nalana-Black.png" alt="nalana N mark dark" style="filter:none;" />
    <div class="bg-label">Dark BG</div>
  </div>

    <div style="display:flex;gap:24px;align-items:center;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:24px;height:24px;border-radius:50%;background:#1085EF;"></div>
        <span style="font-size:12px;font-weight:600;color:#1a1a1a;">#1085EF</span>

      <div style="display:flex;align-items:center;gap:8px;">
