<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fafafa; font-family: 'Inter', sans-serif; padding: 24px; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .swatch-color { height: 56px; }
  .swatch-info { padding: 8px 10px; background: #fff; }
  .swatch-name { font-size: 10px; font-weight: 600; color: #1a1a1a; letter-spacing: 0.04em; }
  .swatch-hex  { font-size: 10px; color: #767676; font-family: 'SF Mono', monospace; margin-top: 1px; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="swatch-color" style="background:#FAFAFA; border:1px solid #e4e4e7;"></div><div class="swatch-info"><div class="swatch-name">BG</div><div class="swatch-hex">#FAFAFA</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#F1F1F1; border:1px solid #e4e4e7;"></div><div class="swatch-info"><div class="swatch-name">Off-White</div><div class="swatch-hex">#F1F1F1</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#E4E4E7;"></div><div class="swatch-info"><div class="swatch-name">N-200</div><div class="swatch-hex">#E4E4E7</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#D4D4D8;"></div><div class="swatch-info"><div class="swatch-name">N-300</div><div class="swatch-hex">#D4D4D8</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#A1A1AA;"></div><div class="swatch-info"><div class="swatch-name">N-400</div><div class="swatch-hex">#A1A1AA</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#767676;"></div><div class="swatch-info"><div class="swatch-name">Muted</div><div class="swatch-hex">#767676</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#444444;"></div><div class="swatch-info"><div class="swatch-name">N-600</div><div class="swatch-hex">#444444</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#343434;"></div><div class="swatch-info"><div class="swatch-name">Ink Deck</div><div class="swatch-hex">#343434</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#1A1A1A;"></div><div class="swatch-info"><div class="swatch-name">Ink</div><div class="swatch-hex">#1A1A1A</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#0A0A0A;"></div><div class="swatch-info"><div class="swatch-name">Deep</div><div class="swatch-hex">#0A0A0A</div></div></div>
</div>
</body>
</html>
