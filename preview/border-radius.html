<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fafafa; font-family: 'Inter', sans-serif; padding: 24px; }
  .row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shape { background: #1085EF; opacity: 0.15; border: 2px solid #1085EF; }
  .label { font-size: 10px; font-weight: 600; color: #767676; text-align: center; }
  .val   { font-size: 10px; color: #a1a1aa; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="block"><div class="shape" style="width:40px;height:40px;border-radius:8px;"></div><div class="label">sm</div><div class="val">8px</div></div>
  <div class="block"><div class="shape" style="width:48px;height:48px;border-radius:16px;"></div><div class="label">md</div><div class="val">16px</div></div>
  <div class="block"><div class="shape" style="width:56px;height:56px;border-radius:28px;"></div><div class="label">lg</div><div class="val">28px</div></div>
  <div class="block"><div class="shape" style="width:64px;height:64px;border-radius:40px;"></div><div class="label">xl</div><div class="val">40px</div></div>
  <div class="block"><div class="shape" style="width:72px;height:72px;border-radius:50px;"></div><div class="label">2xl</div><div class="val">50px</div></div>
  <div class="block"><div class="shape" style="width:80px;height:40px;border-radius:100px;background:#FF8C69;opacity:0.15;border-color:#FF8C69;"></div><div class="label">pill</div><div class="val">100px</div></div>
  <div class="block" style="margin-left:24px;">
    <div style="display:flex;gap:8px;align-items:center;">
      <div style="background:#1085EF;color:#fff;padding:8px 20px;border-radius:100px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;">CTA →</div>
      <div style="background:rgba(255,255,255,0.4);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.6);border-top:1px solid rgba(255,255,255,0.9);padding:8px 16px;border-radius:40px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;color:#1a1a1a;box-shadow:inset 0 4px 8px rgba(255,255,255,0.7),0 4px 12px rgba(0,0,0,0.08);">card</div>
      <div style="background:rgba(0,0,0,0.06);padding:4px 12px;border-radius:100px;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;color:#444;border:1.5px solid rgba(0,0,0,0.12);letter-spacing:0.04em;text-transform:uppercase;">TAG</div>
    </div>
    <div class="label" style="margin-top:6px;">in context</div>
  </div>
</div>
</body>
</html>
