<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://api.fontshare.com/v2/css?f[]=amulya@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fafafa; font-family: 'Inter', sans-serif; padding: 24px; }
  .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch { border-radius: 12px; overflow: hidden; flex: 1; min-width: 100px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .swatch-color { height: 72px; }
  .swatch-info { padding: 10px 12px; background: #fff; }
  .swatch-name { font-size: 11px; font-weight: 600; color: #1a1a1a; text-transform: uppercase; letter-spacing: 0.05em; }
  .swatch-hex  { font-size: 12px; color: #767676; margin-top: 2px; font-family: 'SF Mono', monospace; }
</style>
</head>
<body>
<div class="swatches">
  <div class="swatch">
    <div class="swatch-color" style="background:#1085EF;"></div>
    <div class="swatch-info"><div class="swatch-name">Primary Blue</div><div class="swatch-hex">#1085EF</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#0A6FCC;"></div>
    <div class="swatch-info"><div class="swatch-name">Primary Dark</div><div class="swatch-hex">#0A6FCC</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#60A5FA;"></div>
    <div class="swatch-info"><div class="swatch-name">Primary Light</div><div class="swatch-hex">#60A5FA</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#FF8C69;"></div>
    <div class="swatch-info"><div class="swatch-name">Salmon</div><div class="swatch-hex">#FF8C69</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#EE481E;"></div>
    <div class="swatch-info"><div class="swatch-name">Salmon Dark</div><div class="swatch-hex">#EE481E</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#A78ADE;"></div>
    <div class="swatch-info"><div class="swatch-name">Lavender</div><div class="swatch-hex">#A78ADE</div></div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#F8D06C;"></div>
    <div class="swatch-info"><div class="swatch-name">Sunshine</div><div class="swatch-hex">#F8D06C</div></div>
  </div>
</div>
</body>
</html>
