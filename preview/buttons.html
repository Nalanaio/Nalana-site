<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f1f1f1; font-family: 'Inter', sans-serif; padding: 28px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .row:last-child { margin-bottom: 0; }
  .section-label { font-size: 10px; font-weight: 600; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }

  /* Primary CTA glass-blue */
  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 28px; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
    border: none; border-radius: 100px; cursor: pointer; text-decoration: none;
    background: linear-gradient(135deg, rgba(96,165,250,0.7) 0%, rgba(16,133,239,0.8) 30%, rgba(99,102,241,0.7) 70%, rgba(16,133,239,0.75) 100%);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.5);
    border-top: 1px solid rgba(255,255,255,0.85);
    box-shadow: inset 0px 5px 10px rgba(255,255,255,0.45), inset 0px -5px 12px rgba(0,0,80,0.12), 0px 8px 24px rgba(16,133,239,0.3);
    color: #fff; position: relative; overflow: hidden;
    transition: all 0.2s ease;
  }
  .btn-primary::before { content: ''; position: absolute; top: 2px; left: 15%; width: 70%; height: 45%; background: linear-gradient(to bottom, rgba(255,255,255,0.6), transparent); border-radius: 50%; pointer-events: none; }

  /* Secondary neutral */
  .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 28px; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
    border-radius: 100px; cursor: pointer; text-decoration: none;
    border: 1.5px solid rgba(0,0,0,0.18); background: transparent; color: #1a1a1a;
    transition: all 0.2s ease;
  }

  /* Nav pill btn */
  .btn-nav {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 8px 20px; font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif;
    border-radius: 100px; cursor: pointer; text-decoration: none;
    background: linear-gradient(135deg, rgba(96,165,250,0.7) 0%, rgba(16,133,239,0.8) 50%, rgba(16,133,239,0.75) 100%);
    border: 1px solid rgba(255,255,255,0.5);
    border-top: 1px solid rgba(255,255,255,0.85);
    box-shadow: inset 0px 5px 10px rgba(255,255,255,0.45), 0px 4px 12px rgba(16,133,239,0.25);
    color: #fff; position: relative; overflow: hidden;
  }
  .btn-nav::before { content: ''; position: absolute; top: 1px; left: 15%; width: 70%; height: 50%; background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent); border-radius: 50%; pointer-events: none; }

  /* Eyebrow pill */
  .eyebrow {
    display: inline-block; padding: 8px 16px; border-radius: 100px;
    font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif;
    text-transform: uppercase; letter-spacing: 0.05em; color: #1a1a1a;
    border: 1.5px solid rgba(0,0,0,0.15);
    background: rgba(255,255,255,0.4); backdrop-filter: blur(12px);
    box-shadow: inset 0 3px 6px rgba(255,255,255,0.7), 0 2px 8px rgba(0,0,0,0.06);
  }
</style>
</head>
<body>
  <div class="section-label">Primary · Secondary · Nav · Tag</div>
  <div class="row">
    <button class="btn-primary">Reserve Founding Spot — $1 →</button>
    <button class="btn-secondary">Join Free Waitlist</button>
    <button class="btn-nav">Reserve $1 →</button>
    <span class="eyebrow">Early Access Open</span>
  </div>
  <div class="row">
    <button class="btn-primary" style="padding:10px 22px;font-size:13px;">Get Started →</button>
    <button class="btn-secondary" style="padding:10px 22px;font-size:13px;">Learn more</button>
    <button class="btn-primary" style="padding:8px 18px;font-size:12px;">Download</button>
    <span class="eyebrow" style="padding:6px 12px;font-size:10px;">Beta</span>
  </div>
</body>
</html>
