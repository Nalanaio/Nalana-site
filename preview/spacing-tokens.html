<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fafafa; font-family: 'Inter', sans-serif; padding: 20px 24px; }
  .grid { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .token { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: #1085EF; border-radius: 3px; width: 24px; opacity: 0.85; }
  .name { font-size: 10px; font-weight: 600; color: #767676; }
  .val  { font-size: 10px; color: #a1a1aa; }
</style>
</head>
<body>
<div class="grid">
  <div class="token"><div class="bar" style="height:4px;"></div><div class="name">s-1</div><div class="val">4px</div></div>
  <div class="token"><div class="bar" style="height:8px;"></div><div class="name">s-2</div><div class="val">8px</div></div>
  <div class="token"><div class="bar" style="height:12px;"></div><div class="name">s-3</div><div class="val">12px</div></div>
  <div class="token"><div class="bar" style="height:16px;"></div><div class="name">s-4</div><div class="val">16px</div></div>
  <div class="token"><div class="bar" style="height:24px;"></div><div class="name">s-5</div><div class="val">24px</div></div>
  <div class="token"><div class="bar" style="height:32px;"></div><div class="name">s-6</div><div class="val">32px</div></div>
  <div class="token"><div class="bar" style="height:40px;"></div><div class="name">s-7</div><div class="val">40px</div></div>
  <div class="token"><div class="bar" style="height:48px;"></div><div class="name">s-8</div><div class="val">48px</div></div>
  <div class="token"><div class="bar" style="height:64px;background:#A78ADE;"></div><div class="name">s-9</div><div class="val">64px</div></div>
  <div class="token"><div class="bar" style="height:80px;background:#F8D06C;"></div><div class="name">s-10</div><div class="val">80px</div></div>
  <div class="token"><div class="bar" style="height:100px;background:#FF8C69;"></div><div class="name">s-11</div><div class="val">100px</div></div>
</div>
</body>
</html>
