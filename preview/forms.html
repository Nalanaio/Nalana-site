<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>@font-face{font-family:'Amulya';src:url('../fonts/Amulya-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, rgba(191,219,254,0.3), rgba(233,213,255,0.2), rgba(251,207,232,0.25));
    background-color: #f1f1f1;
    font-family: 'Inter', sans-serif; padding: 24px;
    display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start;
  }
  .form-card {
    flex: 1; min-width: 280px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(16px);
    border-radius: 32px;
    border: 1px solid rgba(255,255,255,0.4);
    border-top: 1px solid rgba(255,255,255,0.9);
    box-shadow: inset 0px 6px 12px rgba(255,255,255,0.8), inset 0px -6px 15px rgba(0,0,0,0.08), 0px 15px 35px rgba(0,0,0,0.08);
    padding: 24px 28px;
    position: relative; overflow: hidden;
  }
  .form-card::before { content:''; position:absolute; top:2px; left:10%; width:80%; height:30%; background: linear-gradient(to bottom, rgba(255,255,255,0.9), transparent); border-radius:50%; pointer-events:none; }
  .form-title { font-family: 'Amulya', sans-serif; font-size: 18px; font-weight: 700; color: #0a0a0a; margin-bottom: 4px; }
  .form-sub   { font-size: 12px; color: #767676; margin-bottom: 16px; }
  .form-row   { display: flex; gap: 10px; }
  .form-input {
    flex: 1;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.8);
    padding: 12px 20px; border-radius: 100px;
    font-family: 'Inter', sans-serif; font-size: 14px; color: #1a1a1a;
    outline: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
  }
  .form-input::placeholder { color: #a1a1aa; }
  .form-btn {
    padding: 12px 20px; border-radius: 100px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; color: #fff;
    background: linear-gradient(135deg, rgba(96,165,250,0.7) 0%, rgba(16,133,239,0.8) 40%, rgba(16,133,239,0.75) 100%);
    border: 1px solid rgba(255,255,255,0.5);
    border-top: 1px solid rgba(255,255,255,0.85);
    box-shadow: inset 0 4px 8px rgba(255,255,255,0.4), 0 6px 18px rgba(16,133,239,0.28);
    position: relative; overflow: hidden; white-space: nowrap;
  }
  .form-btn::before { content:''; position:absolute; top:2px; left:15%; width:70%; height:50%; background:linear-gradient(to bottom,rgba(255,255,255,0.55),transparent); border-radius:50%; pointer-events:none; }
</style>
</head>
<body>
  <div class="form-card">
    <div class="form-title">Claim Your Founding Spot</div>
    <div class="form-sub">$1 holds your spot, credited toward your first month.</div>
    <div class="form-row">
      <input class="form-input" type="email" placeholder="your@email.com" />
      <button class="form-btn">Reserve — $1 →</button>
    </div>
  </div>
  <div class="form-card" style="max-width:240px;">
    <div class="form-title" style="font-size:15px;">Free Waitlist</div>
    <div class="form-sub">Get notified on launch.</div>
    <div class="form-row" style="flex-direction:column;gap:8px;">
      <input class="form-input" type="email" placeholder="your@email.com" />
      <button class="form-btn" style="width:100%;justify-content:center;">Join Free →</button>
    </div>
  </div>
</body>
</html>
